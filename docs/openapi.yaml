  /v2/topics:
    post:
      tags:
      - topics
      operationId: createTopic
      summary: Create a topic
      description: Create an encrypted topic at epoch zero. The caller must have a registered encryption
        identity and owner/parent role. The subject is already encrypted using the client-chosen topic
        ID as authenticated context. Writes remain blocked until a complete recipient set and the encrypted
        subject are committed as epoch one. No encryption flag or initial_key_id is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              required:
              - topic_id
              - subject
              - kind
              - participant_member_ids
              additionalProperties: false
              properties:
                topic_id:
                  type: string
                  pattern: ^[0-9a-f]{32}$
                  description: Client-generated operation/topic ID chosen before encryption; retry the
                    identical payload with this ID.
                subject: &id002
                  $ref: '#/components/schemas/EncryptedContent'
                kind:
                  $ref: '#/components/schemas/TopicKind'
                participant_member_ids:
                  type: array
                  maxItems: 20
                  items:
