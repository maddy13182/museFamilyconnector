              schema:
                type: object
                required:
                - topic
                properties:
                  topic:
                    $ref: '#/components/schemas/Topic'
        '200':
          description: Idempotent retry with a repeated Idempotency-Key — the already-created topic is
            returned, nothing is duplicated
          content:
            application/json:
              schema:
                type: object
                required:
                - topic
                - deduped
                properties:
                  topic:
                    $ref: '#/components/schemas/Topic'
                  deduped:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
    get:
