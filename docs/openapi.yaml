openapi: 3.1.0
info:
  title: Family Hub API
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: Family Hub protocol 2. Every conversation is end-to-end encrypted. The client encrypts
    content; the server validates envelopes and lifecycle state and stores ciphertext. This development
    release deliberately has no API v1 or plaintext compatibility. The browser dashboard shows metadata
    only.
servers:
- url: https://REPLACE-WITH-YOUR-WORKER.workers.dev
  description: Your family's deployment (set after `wrangler deploy`).
security:
- bearerAuth: []
tags:
- name: families
  description: One-time family bootstrap.
- name: invites
  description: Member invitations (single-use codes).
- name: auth
  description: Token rotate / revoke / provision (agent credentials).
- name: members
  description: Family roster.
- name: topics
  description: Conversations — create, invite, spawn linked children, read, export.
- name: entries
  description: Append-only log writes (messages).
- name: tasks
  description: Task lifecycle and delegation.
- name: sync
  description: Poll loop — new entries across all visible topics.
- name: ops
  description: Health and privileged redaction.
paths:
  /v2/families:
    post:
      tags:
      - families
      operationId: bootstrapFamily
      summary: Bootstrap a family (one-time)
      description: "Two modes, selected by env `SETUP_LOCKED`:\n- **Open** (`SETUP_LOCKED` unset — first\
        \ deploy only): public\n  bootstrap. Creates the family, the owner member, and returns a\n  one-time\
        \ provisioning code for the owner's first agent.\n- **Locked** (`SETUP_LOCKED=1` — the normal\
        \ running state): server-owner\n  circle creation. Requires a bearer token (401 without one);\
        \ the\n  caller must be a **server owner** (an explicit row in `server_owners`,\n  matched by\
        \ principal id — *not* merely an owner of some circle) or\n  the call is 403 `forbidden`. The\
        \ creator becomes an `owner` member\n  of the new circle and gets a single-use provisioning code\
        \ for their\n  agent in that circle — the existing token stays bound to the old\n  circle. There\
        \ is no `setup_locked` error code; unauthenticated\n  calls are 401 `unauthorized`.\nA second\
        \ *deployment* is only needed for a truly separate family that\nmust not share an operator or\
        \ database; additional circles for people\nyou trust are created in locked mode above.\n"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - owner_name
              - owner_email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Ramamurthy family
                owner_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Mahesh Ramamurthy
                owner_email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '201':
          description: 'Family/circle created. Two shapes: open (bootstrap) mode returns

            `{family, member, provisioning_code, provisioning_expires_at}`;

            locked (hub-owner) mode returns the flat

            `{id, name, kind, created_at, provisioning_code, provisioning_expires_at}`.

            '
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - family
                  - member
                  - provisioning_code
                  - provisioning_expires_at
                  properties:
                    family:
                      $ref: '#/components/schemas/Family'
                    member:
                      $ref: '#/components/schemas/Member'
                    provisioning_code:
                      type: string
                      description: 128-bit random, single-use. Redeem at POST /v2/provision/{code}/accept.
                        Shown once.
                    provisioning_expires_at:
                      type: string
                      format: date-time
                - type: object
                  description: Locked (hub-owner) circle-creation shape.
                  required:
                  - id
                  - name
                  - kind
                  - created_at
                  - provisioning_code
                  - provisioning_expires_at
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    kind:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    provisioning_code:
                      type: string
                      description: Single-use, 24h TTL. Shown once.
                    provisioning_expires_at:
                      type: string
                      format: date-time
        '200':
          description: 'Locked mode, idempotent retry with a repeated Idempotency-Key —

            the circle already existed, so a FRESH provisioning code is issued

            and the orphaned token from the first attempt is revoked.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - kind
                - created_at
                - provisioning_code
                - provisioning_expires_at
                - deduped
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  provisioning_code:
                    type: string
                    description: Single-use, 24h TTL. Shown once.
                  provisioning_expires_at:
                    type: string
                    format: date-time
                  deduped:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Locked mode and the caller is not a hub owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: Only hub owners can create a family while setup is locked
        '409':
          description: Circle name already taken (case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: circle_name_taken
                  message: A circle named "X" already exists
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
    get:
      tags:
      - families
      operationId: listFamilies
      summary: List circles I am a member of
      description: 'Membership is matched by email (one human, one member row per circle).

        Each entry carries `my_role` — the caller''s role in that circle.

        '
      responses:
        '200':
          description: Circle list
          content:
            application/json:
              schema:
                type: object
                required:
                - families
                properties:
                  families:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - kind
                      - my_role
                      - created_at
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        kind:
                          type: string
                        my_role:
                          $ref: '#/components/schemas/Role'
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/families/{fid}/invites:
    post:
      tags:
      - invites
      operationId: createInvite
      summary: Invite a family member
      description: 'Caller must have role `owner` or `parent`. Owners may invite any role;

        parents may invite `parent`/`kid` only (a parent inviting `owner` → 403).

        An email already in the family → 409 `already_member`. Returns a 128-bit

        random invite code (single-use, 7-day expiry) plus a one-time

        `onboarding_url` (`https://<server>/i/<token>`). Only hashes are stored.

        The inviter shares the onboarding URL with the invitee (not the raw

        code): the page asks for the invited email and reveals a fresh

        single-use code plus the exact `hub setup` command. The raw code in

        this response remains valid as a fallback for direct

        `POST /v2/invites/{code}/accept`.

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                required:
                - invite_code
                - expires_at
                - onboarding_url
                properties:
                  invite_code:
                    type: string
                    description: Single-use code. The invitee's agent redeems it at POST /v2/invites/{code}/accept.
                  expires_at:
                    type: string
                    format: date-time
                  onboarding_url:
                    type: string
                    format: uri
                    description: 'One-time onboarding page URL to send the invitee

                      (never post publicly). The page reveals a fresh

                      single-use code after the invitee proves the invited

                      email. Shown once — only the hash is stored.

                      '
        '200':
          description: 'Idempotent retry with a repeated Idempotency-Key — a FRESH invite

            code is minted for the same (email, role) (the original code''s

            plaintext is unrecoverable) instead of duplicating the invite.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - invite_code
                - expires_at
                - onboarding_url
                - deduped
                properties:
                  invite_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  onboarding_url:
                    type: string
                    format: uri
                    description: One-time onboarding page URL (fresh token per retry).
                  deduped:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v2/invites/{code}/accept:
    post:
      tags:
      - invites
      operationId: acceptInvite
      summary: Accept an invite (new member enrollment)
      description: Redeem a single-use code and atomically issue credentials with a mandatory X25519 encryption
        identity. Invalid or missing public keys do not consume the code. Re-enrollment of the same label
        cannot replace its identity key.
      security: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 16
        description: The invite code from POST /v2/families/{fid}/invites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - agent_label
              - agent_public_key
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                agent_label:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: lakshmi-phone-agent
                agent_public_key:
                  type: string
                  description: Canonical standard base64, exactly 32 decoded bytes.
      responses:
        '201':
          description: Member created, token issued (once)
          content:
            application/json:
              schema:
                type: object
                required:
                - member
                - token
                - token_id
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
                  token:
                    type: string
                    description: Bearer token, format fh_<256-bit random base62>. Shown once — never returned
                      again.
                  token_id:
                    type: string
                    description: Stable id for this credential (used for revoke/rotate and audit).
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invite already used — also returns the member and a flag so the client can tell
            the user they are already enrolled but hold no token
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - member
                - token_already_issued
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  member:
                    $ref: '#/components/schemas/Member'
                    description: The already-enrolled member (may be null).
                  token_already_issued:
                    type: boolean
                    example: true
          example:
            error:
              code: invite_used
              message: Invite already used
            member:
              id: m_…
              name: …
              email: …
              role: kid
              created_at: …
            token_already_issued: true
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
  /i/{token}:
    get:
      tags:
      - invites
      operationId: getInvitePage
      summary: Open an invite onboarding page
      description: 'Public — the page token is the credential (256-bit random,

        `fhip_`-prefixed, hash-stored). The inviter shares the `onboarding_url`

        from POST /v2/families/{fid}/invites; the invitee (human or their

        agent) opens it here. Content negotiation: `Accept: application/json`

        or the `/i/{token}.json` form returns the agent JSON page (install

        steps pinned to the server''s recommended CLI release — artifacts

        download from this server''s `/v2/client/download/*` endpoints,

        masked email hint, verify instructions); otherwise an HTML page with

        an email form is returned. Never reveals the invite code. Unknown,

        used, or expired pages return identical 404s. Rate-limited per IP.

        Not under /v2/, so the client version gate does not apply.

        '
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: The page token from the invite's onboarding_url.
      responses:
        '200':
          description: The onboarding page (JSON for agents, HTML for humans)
          content:
            application/json:
              schema:
                type: object
                required:
                - page
                - family_name
                - role
                - email_hint
                - expires_at
                - client
                - install
                - verify
                properties:
                  page:
                    type: string
                    example: invite
                  family_name:
                    type: string
                  role:
                    $ref: '#/components/schemas/Role'
                  email_hint:
                    type: string
                    example: s***@gmail.com
                    description: First char of the invited email's local part, masked.
                  expires_at:
                    type: string
                    format: date-time
                  client:
                    type: object
                    required:
                    - version
                    - download_url
                    - sha256
                    properties:
                      version:
                        type: string
                      download_url:
                        type: string
                        format: uri
                      sha256:
                        type: string
                  install:
                    type: object
                    properties:
                      summary:
                        type: string
                      steps:
                        type: array
                        items:
                          type: string
                      verify_note:
                        type: string
                  verify:
                    type: object
                    properties:
                      method:
                        type: string
                        example: POST
                      path:
                        type: string
                        example: /i/{token}/verify
                        description: Absolute path with the page token echoed back to its holder (the
                          party that presented it in the request URL). A relative ./verify would resolve
                          to /i/verify and 404.
                      body:
                        type: object
                        properties:
                          email:
                            type: string
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /i/{token}/verify:
    post:
      tags:
      - invites
      operationId: verifyInvitePageEmail
      summary: Prove the invited email, receive the invite code
      description: 'Public — the page token is the credential. Body `{"email": "..."}`;

        the candidate is normalized (trim + lowercase) and compared in

        constant time against the invite''s stored email. On a match, returns a

        FRESH single-use invite code for the same (family, email, role) — the

        stored code''s plaintext is unrecoverable, so verification rotates it —

        plus the exact `hub setup` command (server origin derived

        server-side). Normalization is trim + lowercase only (no `+`-tag

        stripping, no Unicode confusable folding); the inviter must use the

        canonical address. On a mismatch: 403. Email guesses are budgeted per page

        (10+ rapid guesses → 429 with `Retry-After`; the budget decays after

        an hour and never hard-locks). The page self-destructs when the invite

        is accepted.

        '
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: The page token from the invite's onboarding_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
      responses:
        '200':
          description: Email confirmed — invite code issued
          content:
            application/json:
              schema:
                type: object
                required:
                - invite_code
                - setup_command
                - expires_at
                properties:
                  invite_code:
                    type: string
                    description: Fresh single-use invite code for POST /v2/invites/{code}/accept.
                  setup_command:
                    type: string
                    example: hub setup --server https://<server> --invite fhi_…
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The email does not match the invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: This email does not match the invitation.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/families/{fid}/transfer:
    post:
      tags:
      - families
      operationId: offerOwnershipTransfer
      summary: Offer circle ownership to another member
      description: 'Two-phase ownership transfer (offer → accept). The caller must be a

        circle `owner`. The target must be an existing member of the SAME

        circle and not already an owner (→ 422 `already_owner`). Ownership is

        never forced: nothing changes until the recipient explicitly accepts

        at POST …/transfer/accept. Exactly one pending offer per circle

        (→ 409 `transfer_pending`); offers expire after 7 days. Supports

        `Idempotency-Key` like the other create endpoints — a repeated key

        returns the original offer with `deduped: true` instead of a second one.

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to_member_id
              properties:
                to_member_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Member id of the recipient (must be in this circle, not already an owner).
                on_complete:
                  $ref: '#/components/schemas/TransferCompletionMode'
                  default: remove
                  description: What happens to the offering owner when the recipient accepts.
      responses:
        '201':
          description: Transfer offer created (pending)
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
        '200':
          description: 'Idempotent retry with a repeated Idempotency-Key — the original

            pending offer is returned with `deduped: true`.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                - deduped
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
                  deduped:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Target is already a circle owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - families
      operationId: getOwnershipTransfer
      summary: Read the pending ownership transfer
      description: 'Any circle member may read the pending offer. Returns

        `{ "transfer": null }` when there is none.

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: The pending transfer, or null
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                properties:
                  transfer:
                    oneOf:
                    - $ref: '#/components/schemas/Transfer'
                    - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/families/{fid}/transfer/accept:
    post:
      tags:
      - families
      operationId: acceptOwnershipTransfer
      summary: Accept an ownership transfer offer
      description: 'Only the named recipient (`to_member_id`) may accept — 403 otherwise.

        The offer must be pending and unexpired (expired → 410

        `transfer_expired`, and the offer is marked cancelled). The role swap

        is applied in ONE atomic batch — the recipient is promoted to `owner`

        and the offering owner is demoted or access-revoked per `on_complete`

        — so the circle never sits with zero owners. `remove` revokes every

        agent token the previous owner held for this circle; their member row

        is retained for audit history.

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                - new_owner
                - previous_owner
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
                  new_owner:
                    type: object
                    required:
                    - id
                    - role
                    properties:
                      id:
                        type: string
                      role:
                        type: string
                        example: owner
                  previous_owner:
                    type: object
                    required:
                    - id
                    - role
                    properties:
                      id:
                        type: string
                      role:
                        type: string
                        enum:
                        - parent
                        - removed
                        description: '`parent` for on_complete=demote, `removed` for on_complete=remove.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /v2/families/{fid}/transfer/cancel:
    post:
      tags:
      - families
      operationId: cancelOwnershipTransfer
      summary: Cancel a pending ownership transfer offer
      description: 'The current circle owner may withdraw a pending offer. The recipient

        cannot cancel (→ 403); only the owner can. An already-expired offer

        returns 410 `transfer_expired`.

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Offer cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer
                properties:
                  transfer:
                    $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /v2/families/{fid}/members/{mid}:
    delete:
      tags:
      - families
      operationId: removeCircleMember
      summary: Soft-remove a member from the circle (owner only)
      description: 'Only the circle owner may remove members. Removal is soft: the

        member row is retained (history references it) with `removed_at`

        set, every agent token of the member is revoked effective now,

        their topic participation is dropped (E2EE topics they were in

        get `rotation_required` — rekey next), and pending ownership

        transfers involving them are cancelled. The freed email becomes

        re-invitable. You cannot remove yourself (→ 400; use the

        ownership transfer to step off) and the last owner cannot be

        removed (→ 400).

        '
      parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required:
                - removed
                properties:
                  removed:
                    type: string
                    description: Member id removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/auth/revoke:
    post:
      tags:
      - auth
      operationId: revokeToken
      summary: Revoke an agent token
      description: 'Revokes `token_id` immediately. A member may revoke their own agents''

        tokens; `owner`/`parent` may revoke any token in the family.

        Revoking the token used for this call is allowed; subsequent calls 401.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_id
              properties:
                token_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
