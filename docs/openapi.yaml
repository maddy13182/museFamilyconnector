      description: 'Returns the member record the calling bearer token is bound to,

        plus the token''s `agent_label`. Clients MUST use this — not

        `/v2/members[0]` — to learn who "I" am: members are ordered by

        creation time, so `[0]` is typically the owner, not the caller.

