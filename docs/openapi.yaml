                  parent_topic_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PiiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
  /v2/topics/{tid}/entries:
    post:
      tags:
      - entries
      operationId: postEntry
      summary: Post an entry (message)
      description: Append encrypted message or briefing content. Metadata-only system events use fixed
        server-generated labels, strict per-kind data and no body. Content is accepted only for the active
        key and outside a rotation gate.
      parameters:
      - $ref: '#/components/parameters/TopicId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Opaque client key; same key + same topic returns the original entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - body
                properties:
                  kind:
                    type: string
                    enum:
                    - message
                    - briefing
                    default: message
                  body: *id002
                  data: *id002
                  reply_to_seq:
                    type: integer
                    minimum: 1
                additionalProperties: false
              - type: object
                required:
                - kind
                - data
                properties:
                  kind:
                    type: string
                    enum:
                    - key_request
                    - pending_key_distribution
                    - topic_archived
                  data:
                    type: object
                    description: 'Strict per-kind metadata: key IDs, real member/agent identifiers, successor
                      topic ID and booleans only. No free text, notes, reasons or content.'
                additionalProperties: false
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                type: object
                required:
                - entry
                properties:
                  entry:
                    $ref: '#/components/schemas/Entry'
        '200':
          description: Idempotent replay — original entry returned, no duplicate created
          content:
            application/json:
              schema:
                type: object
                required:
                - entry
                - deduped
                properties:
                  entry:
                    $ref: '#/components/schemas/Entry'
                  deduped:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PiiError'
        '409':
          description: key_not_active | stale_key | rotation_required | msg_id_conflict
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
