  /v2/provisioning-codes/{code}/redeem:
    post:
      tags:
      - auth
      operationId: redeemProvisioningCode
      summary: Redeem a provisioning code for an agent token
      x-spec-note: Gap-fill implemented by WS-1 — not in SPEC §13. Required by SPEC §6.1/§6.4.
      description: Redeem a single-use code and atomically issue credentials with a mandatory X25519 encryption
        identity. Invalid or missing public keys do not consume the code. Re-enrollment of the same label
        cannot replace its identity key.
      security: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 16
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_public_key:
                  type: string
                  description: Canonical standard base64, exactly 32 decoded bytes.
              required:
              - agent_public_key
      responses:
        '201':
          description: Token issued (once)
          content:
            application/json:
              schema:
                type: object
                required:
                - member
                - token
                - token_id
                properties:
                  member:
                    $ref: '#/components/schemas/Member'
                  token:
                    type: string
                    description: Bearer token, shown once.
                  token_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Code already used — also returns the member and a flag so the client can tell the
            user they are already enrolled but hold no token
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - member
                - token_already_issued
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  member:
                    $ref: '#/components/schemas/Member'
                    description: The member the code was minted for (may be null).
                  token_already_issued:
                    type: boolean
                    example: true
          example:
            error:
              code: code_used
              message: Provisioning code already used
            member:
              id: m_…
              name: …
              email: …
              role: owner
              created_at: …
            token_already_issued: true
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '426':
          $ref: '#/components/responses/ClientTooOld'
