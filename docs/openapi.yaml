  /v2/topics/{tid}/envelopes:
    post:
      tags:
      - e2ee
      operationId: postTopicEnvelope
      summary: Store a sealed topic-key envelope for a recipient agent
      description: 'E2EE (sync v2). STAGED distribution: stores one sealed topic-key

        envelope for the target (member_id, agent_label). The envelope blob

        is opaque to the server: format-validated (standard base64) and

        stored, never inspected. N04: a new key_id is STORED, never flipped —

        only POST .../keys/commit activates a key and advances

        topics.current_key_id. The caller must be a current participant of

        the topic (403 otherwise); introducing a key_id different from the

        topic''s current_key_id is allowed only for owner/parent callers (403

        otherwise). The target must be a current participant AND hold an

        ACTIVE (non-superseded) registered public key (400 otherwise —

        sealing to an agent with no key on file is meaningless; they must

        run `hub key-init` first). The server records the target''s active

        identity-key id on the row (identity_key_id) for the commit''s

        superseded-key check. Re-POSTing the same

        (topic_id, member_id, agent_label, key_id) replaces the stored

        envelope — idempotent distribution — and preserves the original

        created_at (secfix F3).

        '
      parameters:
      - name: tid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_id
              - agent_label
              - key_id
              - envelope
              properties:
                member_id:
                  type: string
                agent_label:
                  type: string
                key_id:
                  type: string
                  description: Random 128-bit topic-key id, 32 hex chars.
                envelope:
                  type: string
                  description: 'Standard base64 crypto_box_seal of (topic_id_bytes || 0x00 || key_id_bytes
                    || topic_key) to the target agent''s X25519 public key (secfix F2: the topic_id binding
                    stops cross-topic envelope transplants). Opaque to the server.

                    '
      responses:
        '201':
          description: Envelope stored
          content:
            application/json:
              schema:
                type: object
                required:
                - topic_id
                - member_id
                - agent_label
                - key_id
                - created_at
                properties:
                  topic_id:
                    type: string
                  member_id:
                    type: string
                  agent_label:
                    type: string
                  key_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - e2ee
      operationId: listTopicEnvelopes
      summary: Fetch my own key envelopes for a topic
      description: 'E2EE (sync v2). Returns ONLY the caller''s own envelopes for COMMITTED

        epochs — rows are matched on the caller''s (member_id, agent_label)

        from the Bearer <redacted> never on caller-supplied input, and joined

        against the topic''s epoch log. Staged (uncommitted) keys stay

        invisible until POST .../keys/commit activates them: an uncommitted

        key must never be treated as usable. Each envelope carries its

        epoch''s `commitment` (hex SHA256 of the topic key; null for

        grandfathered pre-migration epochs) for the CLI''s verify-on-open

        (N07). One agent can never fetch another agent''s envelopes. 403 when

        the caller is not a participant of the topic.

        '
      parameters:
      - name: tid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The caller's envelopes for this topic
          content:
            application/json:
              schema:
                type: object
                required:
                - envelopes
                properties:
                  envelopes:
                    type: array
                    items:
                      type: object
                      required:
                      - topic_id
                      - member_id
                      - agent_label
                      - key_id
                      - envelope
                      - created_at
                      - epoch
                      properties:
                        topic_id:
                          type: string
                        member_id:
                          type: string
                        agent_label:
                          type: string
                        key_id:
                          type: string
                        envelope:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        epoch:
                          type: integer
                          description: Committed epoch this envelope belongs to.
                        commitment:
                          type: string
                          nullable: true
                          description: 'Hex SHA256 of the topic key for verify-on-open; null for grandfathered
                            pre-migration epochs.

                            '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/topics/{tid}/keys/commit:
    post:
      tags:
      - e2ee
      operationId: commitTopicKey
      summary: Staged atomic key activation (sync v2)
      description: Commit the complete staged recipient set for current_epoch + 1. The subject must be
        encrypted with this candidate key. The epoch, encrypted subject and write-unblocking transition
        commit atomically against the membership snapshot. Removed recipients burn the key; missing identities
        or envelopes block activation. There is no force bypass.
      parameters:
      - $ref: '#/components/parameters/TopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_epoch
              - key_id
              - commitment
              - subject
              properties:
                expected_epoch:
                  type: integer
                  minimum: 1
                  description: Must equal current_epoch + 1 (1 for genesis).
                key_id:
                  type: string
                  description: Random 128-bit topic-key id, 32 hex chars; never reused.
                commitment:
                  type: string
                  description: Hex SHA256 of the topic key, 64 hex chars; never reused.
                subject: *id002
              additionalProperties: false
      responses:
        '200':
          description: Epoch committed
          content:
            application/json:
              schema:
                type: object
                required:
                - topic_id
                - epoch
                - key_id
                properties:
                  topic_id:
                    type: string
                  epoch:
                    type: integer
                  key_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v2/tasks/{tid}/notes:
    post:
      tags:
