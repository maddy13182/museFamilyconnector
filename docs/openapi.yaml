        '409':
          $ref: '#/components/responses/Conflict'
  /v2/health:
    get:
      tags:
      - ops
      operationId: healthCheck
      summary: Liveness check
      description: 'Public. Returns ok, the server version, and the API majors this

        server speaks. The client version gate never blocks this endpoint.

        '
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - version
                - api_versions
                properties:
                  ok:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: 0.12.0
                  api_versions:
                    type: array
                    items:
                      type: string
                    example:
                    - v1
                    description: 'The API majors this server implements. Clients pick the

                      highest major they implement (v1 today). Becomes

                      ["v1","v2"] if a breaking change ever lands.

                      '
  /v2/client/latest:
    get:
      tags:
      - ops
      operationId: getClientLatest
      summary: Current CLI release known to this server
      description: 'Public. Returns the CLI release metadata the deployed server knows

        about, sourced from the repo-controlled `server/client-manifest.json`

        (bundled at build time — no database read; the release workflow is

        the only writer). Used by `hub upgrade` to compare the installed

        version, fetch the new artifacts, and verify their sha256. The client

        version gate never blocks this endpoint, so an outdated client can

        always reach the metadata it needs in order to update. All URLs are

        absolute and self-referential: this server serves its own bundled

        artifacts (see /v2/client/download/*).

        '
      security: []
      responses:
        '200':
          description: CLI release metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                - min_cli_version
                - server_version
                - sha256
                - released_at
                - download_url
                - assets
                - skill
                properties:
                  version:
                    type: string
                    example: 0.9.0
                  min_cli_version:
                    type: string
                    example: 0.9.0
                  server_version:
                    type: string
                    example: 0.12.0
                    description: The version of THIS server build (makes the server↔CLI pairing machine-readable).
                  sha256:
                    type: string
                    example: b7873c4e…
                  released_at:
                    type: string
                    format: date-time
                  download_url:
                    type: string
                    format: uri
                    example: https://<server>/v2/client/download/hub
                    description: Kept for field continuity; repointed at this server. The explicit contract
                      the CLI uses is `assets`.
                  assets:
                    type: object
                    required:
                    - hub
                    - sigstore
                    - manifest
                    properties:
                      hub:
                        type: string
                        format: uri
                        example: https://<server>/v2/client/download/hub
                      sigstore:
                        type: string
                        format: uri
                        example: https://<server>/v2/client/download/hub.sigstore
                      manifest:
                        type: string
                        format: uri
                        example: https://<server>/v2/client/download/manifest.json
                  skill:
                    type: object
                    required:
                    - url
                    - sha256
                    - version
                    description: The versioned skill bundle (SKILL.md, references/, INSTALL.md, requirements.txt
                      plus the hub artifact, its sigstore bundle, and the release manifest), hash-verified
                      at build time. `hub upgrade`'s skill-refresh reads this block.
                    properties:
                      url:
                        type: string
                        format: uri
                        example: https://<server>/v2/client/download/skill.tar.gz
                      sha256:
                        type: string
                        example: 9f2c…
                        description: sha256 of skill.tar.gz (pin skill_sha256, cross-checked against the
                          release manifest at build time)
                      version:
                        type: string
                        example: 0.11.0
                        description: Skill version, from the SKILL VERSION header of agent-skill/SKILL.md
                          (versions independently from the CLI)
  /v2/client/download/hub:
    get:
      tags:
      - ops
      operationId: downloadClientHub
      summary: Download the bundled CLI artifact
      description: 'Public. Serves the `hub` CLI artifact bundled into this server build

        (hash-verified at build time against the pinned release). Exact path

        only — no path parameters, so no traversal surface by construction;

        anything else under /v2/client/download/ 404s. The client version

        gate never blocks this endpoint (an outdated client must be able to

        fetch its replacement). Rate-limited per IP with a generous bucket;

        `Content-Length` is set and `Cache-Control: public, max-age=300`

        (bytes change when the manifest pin updates + the server redeploys —

        NOT immutable).

        '
      security: []
      responses:
        '200':
          description: The CLI artifact bytes
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="hub"
            Cache-Control:
              schema:
                type: string
              description: public, max-age=300
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/client/download/hub.sigstore:
    get:
      tags:
      - ops
      operationId: downloadClientSigstore
      summary: Download the bundled sigstore signature bundle
      description: 'Public. Serves the `hub.sigstore` keyless-OIDC signature bundle for

        the pinned CLI release (same build-bundling, rate limit, and cache

        rules as /v2/client/download/hub). The CLI verifies this seal

        client-side before installing — the trust anchor, unchanged by the

        server-hosted transport.

        '
      security: []
      responses:
        '200':
          description: The sigstore bundle (JSON)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="hub.sigstore"
            Cache-Control:
              schema:
                type: string
              description: public, max-age=300
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/client/download/manifest.json:
    get:
      tags:
      - ops
      operationId: downloadClientManifest
      summary: Download the release manifest for the bundled CLI
      description: 'Public. Serves the release `manifest.json` ({version, sha256, files,

        signature, identity, released_at}) for the pinned CLI release (same

        build-bundling, rate limit, and cache rules as

        /v2/client/download/hub). The CLI verifies sha256(hub) against this

        manifest client-side before installing.

        '
      security: []
      responses:
        '200':
          description: The release manifest (JSON)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="manifest.json"
            Cache-Control:
              schema:
                type: string
              description: public, max-age=300
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/client/download/skill.tar.gz:
    get:
      tags:
      - ops
      operationId: downloadSkillBundle
      summary: Download the versioned skill bundle
      description: 'Public. Serves the `skill.tar.gz` bundle for the pinned CLI release:

        `SKILL.md`, `references/`, `INSTALL.md`, `requirements.txt`, plus

        the `hub` artifact, its `hub.sigstore` bundle, and the release

        `manifest.json` (same build-bundling, rate limit, and cache rules as

        /v2/client/download/hub). The bundler verifies sha256(skill.tar.gz)

        against BOTH the pin''s `skill_sha256` and the release manifest''s

        `skill_sha256` at build time, and structurally validates the tarball

        (relative paths only, no links). `hub upgrade`''s skill-refresh

        verifies the sha256 client-side before extracting.

        '
      security: []
      responses:
        '200':
          description: The skill bundle (gzipped tar)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="skill.tar.gz"
            Cache-Control:
              schema:
                type: string
              description: public, max-age=300
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/server/owners:
    get:
      tags:
      - server
      operationId: listServerOwners
      summary: List server owners
      description: 'Server ownership control plane — **server owners only** (403 otherwise).

        Server ownership is explicit (rows in `server_owners`) and is what

        grants circle-creation power. Circle owners manage only their own

        circle and cannot use this endpoint.

        '
      responses:
        '200':
          description: The server owners, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                - owners
                properties:
                  owners:
                    type: array
                    items:
                      type: object
                      required:
                      - principal_id
                      - created_at
                      properties:
                        principal_id:
                          type: string
                        name:
                          type: string
                          nullable: true
                        email:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - server
      operationId: promoteServerOwner
      summary: Promote a principal to server owner
      description: 'Server ownership control plane — **server owners only** (403 otherwise).

        Promotes one principal to server owner, granting them circle-creation

        power. Identify the principal directly (`principal_id`) or pass one of

        their member ids (`member_id`) and the server resolves it. Idempotent:

        promoting an existing server owner returns the row.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: string
                  description: Principal id to promote
                member_id:
                  type: string
                  description: Member id whose principal gets promoted
      responses:
        '201':
          description: The promoted server owner
          content:
            application/json:
              schema:
                type: object
                required:
                - owner
                properties:
                  owner:
                    type: object
                    required:
                    - principal_id
                    - created_at
                    properties:
                      principal_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/server/owners/{principal}:
    delete:
      tags:
      - server
      operationId: demoteServerOwner
      summary: Demote a server owner
      description: 'Server ownership control plane — **server owners only** (403 otherwise).

        Removes one principal from the server owners. Refuses to demote the

        last server owner (400): an empty table would lock everyone out of

        circle creation and promotion alike.

        '
      parameters:
      - name: principal
        in: path
        required: true
        schema:
          type: string
        description: Principal id to demote
      responses:
        '200':
          description: The demoted principal
          content:
            application/json:
              schema:
                type: object
                required:
                - removed
                properties:
                  removed:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: fh_<token>
      description: 'Per-agent bearer token issued at invite/provision accept. Sent as `Authorization:
        Bearer <token>`.'
  parameters:
    FamilyId:
      name: fid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MemberId:
      name: mid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TopicId:
      name: tid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TaskId:
      name: tid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Role:
      type: string
      enum:
      - owner
      - parent
      - kid
    TopicKind:
      type: string
      enum:
      - direct
      - group
    LinkVisibility:
      type: string
      enum:
      - placeholder
      - hidden
      default: placeholder
    HistoryFrom:
      type: string
      enum:
      - full
      - from_join
    EntryKind:
      type: string
      enum:
      - message
      - briefing
      - member_joined
      - member_left
      - topic_spawned
      - task_created
      - task_assigned
      - task_status
      - task_note
      - task_done
      - redaction
      - key_rotated
      - key_request
      - pending_key_distribution
      - topic_archived
    TaskStatus:
      type: string
      enum:
      - open
      - in_progress
      - blocked
      - done
      - cancelled
    ErrorCode:
      type: string
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - setup_locked
      - not_found
      - subtasks_open
      - already_member
      - invite_used
      - invite_expired
      - code_used
      - code_expired
      - pii_detected
      - rate_limited
      - client_too_old
      - schema_required
      - internal
      - already_owner
      - transfer_pending
      - transfer_expired
      - transfer_recipient_gone
      - transfer_offer_lapsed
      - noncontiguous_ack
      - invalid_read_receipt
      - stale_epoch
      - key_reuse
      - key_material_reuse
      - recipients_removed_key_burned
      - superseded_identity_key
      - incomplete_distribution
      - misconfigured
      - plaintext_in_e2ee_topic
      - msg_id_conflict
      - key_not_active
      - stale_key
      - rotation_required
      - operation_conflict
      - history_not_granted
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
    Family:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Member:
      type: object
      description: 'family_id is present on roster endpoints (GET /v2/members, GET /v2/me) and absent
        from enrollment responses (invite accept, bootstrap), which return a narrower shape.

        '
      required:
      - id
      - name
      - email
      - role
      - created_at
      properties:
        id:
          type: string
        family_id:
          type: string
          description: Present on roster/self endpoints; absent on enrollment responses.
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
    TransferCompletionMode:
      type: string
      enum:
      - demote
      - remove
      description: 'What happens to the offering owner once the recipient accepts:

        `demote` drops them to parent (their tokens keep working); `remove`

        strips the owner role AND revokes all of their agent tokens for the

        circle, ending their access entirely. The member row itself is

        retained for audit history.

        '
    Transfer:
      type: object
      required:
      - id
      - family_id
      - from_member_id
      - to_member_id
      - on_complete
      - status
      - created_at
      - expires_at
      properties:
        id:
          type: string
        family_id:
          type: string
        from_member_id:
          type: string
          description: The offering owner.
        to_member_id:
          type: string
          description: The named recipient — only they may accept.
        on_complete:
          $ref: '#/components/schemas/TransferCompletionMode'
        status:
          type: string
          enum:
          - pending
          - completed
          - cancelled
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Offers expire 7 days after creation; expired offers cannot be accepted (410).
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Set when the transfer completes, is cancelled, or is noticed expired.
    TokenInfo:
      type: object
      required:
      - token_id
      - member_id
      - agent_label
      - created_at
      properties:
        token_id:
          type: string
        member_id:
          type: string
        agent_label:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
      description: Token metadata. The token VALUE is never returned by any endpoint after issuance.
    TopicParticipantView:
      type: object
      description: 'Participant as returned by the topic detail and export endpoints — a separate top-level
        array, not nested in the topic. history_from_seq is present on export; the detail endpoint omits
        it.

        '
      required:
      - member_id
      - name
      - role
      - joined_at
      properties:
        member_id:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joined_at:
          type: string
          format: date-time
        history_from_seq:
          type: integer
          minimum: 1
    Topic:
      type: object
      description: 'Note: the SQLite-backed server encodes booleans as integers, so parents_only may arrive
        as true/false or 1/0 — clients MUST accept both. (Server-side coercion to true booleans is a recommended
        cleanup.)

        '
      required:
      - id
      - family_id
      - subject
      - kind
      - parents_only
      - created_by
      - created_at
      properties:
        id:
          type: string
        family_id:
          type: string
        subject: *id002
        kind:
          $ref: '#/components/schemas/TopicKind'
        parents_only:
          type: boolean
        parent_topic_id:
          type:
          - string
          - 'null'
        link_visibility:
          $ref: '#/components/schemas/LinkVisibility'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        e2ee:
          type: integer
          const: 1
          description: 'Invariant: all topics are encrypted.'
        current_key_id:
          type:
          - string
          - 'null'
          description: NULL until genesis commits; then the active committed key ID.
    Entry:
      type: object
      required:
      - gseq
      - topic_id
      - seq
      - ts
      - actor_member_id
      - agent_label
      - kind
      - body
      properties:
        gseq:
          type: integer
          description: Global family ordering (drives /sync cursors). Equals the entry id.
        topic_id:
          type: string
        seq:
          type: integer
          description: Per-topic ordering (drives history/threads).
        ts:
          type: string
          format: date-time
        actor_member_id:
          type: string
          description: Stamped server-side from the token.
        agent_label:
          type: string
        token_id:
          type: string
          description: 'Credential attribution. Required by SPEC section 3 but currently omitted by the
            server — clients MUST NOT require it. (Recommended server cleanup: include it in the serialized
            entry.)

            '
        kind:
          $ref: '#/components/schemas/EntryKind'
        body:
          type: string
        data:
          type:
          - object
          - 'null'
          description: Free-form JSON machine payload.
        reply_to_seq:
          type:
          - integer
          - 'null'
    Task:
      type: object
      required:
      - id
      - topic_id
      - title
      - status
      - owner_member_id
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
        topic_id:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/TaskStatus'
        owner_member_id:
          type: string
        assignee_member_id:
          type:
          - string
          - 'null'
        parent_task_id:
          type:
          - string
          - 'null'
        due_at:
          type:
          - string
          - 'null'
          format: date-time
        result:
          type:
          - object
          - 'null'
          description: Structured handoff payload, set on done.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EncryptedContent:
      type: string
      pattern: ^fh1\.[0-9a-f]{32}\.[0-9a-f]{32}\.[A-Za-z0-9+/]+={0,2}$
      description: XChaCha20-Poly1305 encrypted field, bound to topic ID, key ID and message ID. Canonical
        padded base64 contains a 24-byte nonce and at least a 16-byte tag.
  responses:
    BadRequest:
      description: Bad request — input failed validation (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: 'subject: must be 1..200 characters'
    Unauthorized:
      description: Missing, unknown, or revoked token (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Invalid or revoked token.
    Forbidden:
      description: Valid token, but not a participant / wrong role (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: You are not a participant of this topic.
    NotFound:
      description: Unknown id / code (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Topic not found.
    Conflict:
      description: State conflict — subtasks_open, already_member, invite_used, code_used (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: subtasks_open
              message: Task has open subtasks.
    Gone:
      description: Expired single-use code — invite_expired, code_expired (410)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invite_expired
              message: Invite expired.
    PiiError:
      description: Possible PII detected — rejected, nothing stored (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: pii_detected
              message: Possible card number detected in body; rephrase without the number and retry.
    RateLimited:
      description: Too many requests (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Slow down.
    ClientTooOld:
      description: 'Client version below the server''s MIN_CLI_VERSION (426). Fired by

        the client version gate on /v2/* requests carrying a

        `family-hub-agent/<semver>` User-Agent — except /v2/health,

        /v2/client/latest, and /v2/client/download/*, which an outdated

        client must always reach in order to update.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: client_too_old
              message: 'Client version 0.5.0 is below the required minimum 0.9.0. Update your CLI: see
                agent-skill/INSTALL.md (hub upgrade), then retry.'
