# CD (optional): on push to main (or manual dispatch) → build, test, migrate D1, deploy.
#
# Needs GitHub Actions secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard overview page
# The deploy job skips gracefully when they aren't set (forks, local-deploy
# users). NOTE: secrets may not be referenced in `if:` conditions per GitHub
# docs, so a small `check` job maps the secret to an output and the deploy
# job gates on `needs.check` (an allowed context) instead.
#
# One-time manual setup first (see docs/DEPLOY.md):
#   1. D1 database created, database_id filled into server/wrangler.toml
#   2. TOKEN_PEPPER set as a worker secret (dashboard or `wrangler secret put`)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.creds.outputs.enabled }}
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN secret set — skipping Cloudflare deploy (local deploy is the primary path; see README)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test

      - name: Apply D1 migrations
        run: npx -y wrangler@4.149.0 d1 migrations apply family-hub --remote

      - name: Deploy worker
        run: npx -y wrangler@4.149.0 deploy
