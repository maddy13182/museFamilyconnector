# CD: on push to main (or manual dispatch) → build, test, migrate D1, deploy.
#
# Required GitHub Actions secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard overview page
#
# One-time manual setup first (see docs/DEPLOY.md):
#   1. D1 database created, database_id filled into server/wrangler.toml
#   2. TOKEN_PEPPER set as a worker secret (dashboard or `wrangler secret put`)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test

      - name: Apply D1 migrations
        run: npx -y wrangler@4.149.0 d1 migrations apply family-hub --remote

      - name: Deploy worker
        run: npx -y wrangler@4.149.0 deploy
