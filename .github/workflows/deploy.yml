# CD (optional): on push to main (or manual dispatch) → build, test, migrate D1, deploy.
#
# Needs GitHub Actions secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — scoped API token with Workers Scripts and D1 Edit (docs/DEPLOY.md)
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard overview page
# The deploy job skips gracefully when they aren't set (forks, local-deploy
# users). NOTE: secrets may not be referenced in `if:` conditions per GitHub
# docs, so a small `check` job maps the secret to an output and the deploy
# job gates on `needs.check` (an allowed context) instead.
#
# First provision with npm run deploy:hub (docs/DEPLOY.md).
# Set Actions variable CLOUDFLARE_HUB_NAME to explicitly select the existing hub.
# CI discovers its DB binding; no deployment-specific config is committed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.creds.outputs.enabled }}
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_HUB_NAME: ${{ vars.CLOUDFLARE_HUB_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_HUB_NAME}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials or CLOUDFLARE_HUB_NAME missing — skipping deploy (see docs/DEPLOY.md)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HUB_NAME: ${{ vars.CLOUDFLARE_HUB_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Discover existing binding, migrate, deploy and verify
        run: npm run deploy:hub -- --name "$CLOUDFLARE_HUB_NAME" --existing
