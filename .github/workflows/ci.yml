# CI: every PR and branch push must pass ALL jobs before merge to main.
# Branch protection on `main` requires these jobs (by name) to be green.
# No deploy, no secrets needed. All third-party actions are pinned to
# immutable commit SHAs (see .github/dependabot.yml for update proposals).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  server:
    name: server build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test

      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high

  agent:
    name: agent CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run agent CLI tests
        run: python3 -m unittest discover -s agent-skill/tests

  security:
    name: security scan (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Semgrep (security-audit + secrets rulesets)
        run: |
          pip install --quiet semgrep
          semgrep --config p/security-audit --config p/secrets --error .

      - name: Bandit (agent CLI)
        run: |
          pip install --quiet bandit
          bandit -r agent-skill/hub

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-check:
    name: version bump gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Versions in sync + bump required for functional changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          v_file="$(cat VERSION)"
          v_pkg="$(python3 -c "import json; print(json.load(open('server/package.json'))['version'])")"
          v_hub="$(grep -E '^VERSION = ' agent-skill/hub | cut -d'"' -f2)"
          if [ "$v_file" != "$v_pkg" ] || [ "$v_file" != "$v_hub" ]; then
            echo "::error::Version mismatch: VERSION=$v_file server/package.json=$v_pkg agent-skill/hub=$v_hub. Keep all three in sync (docs/VERSIONING.md)."
            exit 1
          fi
          echo "versions consistent: $v_file"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/${BASE_REF}"
            functional="$(git diff --name-only "${base}...HEAD" -- server/src server/migrations agent-skill/hub agent-skill/tests || true)"
            versioned="$(git diff --name-only "${base}...HEAD" -- VERSION server/package.json || true)"
            changelog="$(git diff --name-only "${base}...HEAD" -- CHANGELOG.md || true)"
            if [ -n "$functional" ] && [ -z "$versioned" ]; then
              echo "::error::This PR changes functional code but does not bump the version. Update VERSION, server/package.json, agent-skill/hub and CHANGELOG.md per docs/VERSIONING.md."
              exit 1
            fi
            if [ -n "$versioned" ] && [ -z "$changelog" ]; then
              echo "::error::Version bumped but CHANGELOG.md not updated. Add an entry per docs/VERSIONING.md."
              exit 1
            fi
            echo "version gate passed"
          fi
