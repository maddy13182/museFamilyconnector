# CI: every PR and branch push must pass ALL jobs before merge to main.
# Branch protection on `main` requires these jobs (by name) to be green:
# server, agent, security, secrets, api-parity, version-check. When adding a
# job here, add its name to main's required status checks too.
# No deploy, no secrets needed. All third-party actions are pinned to
# immutable commit SHAs (see .github/dependabot.yml for update proposals).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  server:
    name: server build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install integration dependencies
        working-directory: .
        run: pip install -r agent-skill/requirements.lock

      - name: Production CLI and Worker encryption journeys
        working-directory: .
        run: python3 integration/test_encryption.py

      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high

  agent:
    name: agent CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install agent dependencies (reproducible, lockfile only)
        run: pip install -r agent-skill/requirements.lock

      - name: Run agent CLI tests
        # Includes lockfile-freshness (test_packaging.LockfileTests):
        # fails if requirements.txt and requirements.lock disagree.
        run: python3 -m unittest discover -s agent-skill/tests

      - name: Run repo script tests (changelog + PR check)
        run: python3 -m unittest discover -s scripts/tests

  security:
    name: security scan (semgrep + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Semgrep (security-audit + secrets rulesets)
        run: |
          pip install --quiet semgrep
          semgrep --config p/security-audit --config p/secrets --error .

      - name: Bandit (agent CLI)
        run: |
          pip install --quiet bandit
          bandit -r agent-skill/hub

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-parity:
    name: openapi parity (router vs docs/openapi.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Route patterns in server/src/index.ts must match docs/openapi.yaml
        run: python3 scripts/check_openapi_parity.py

  version-check:
    name: version bump gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version bumps match changelog fragments
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          if [ -n "$BASE_REF" ]; then
            python3 scripts/pr_check.py --base "origin/${BASE_REF}"
          else
            echo "no base ref (not a PR); skipping"
          fi
