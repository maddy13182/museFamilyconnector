# CI: build + test every PR and branch push. No deploy, no secrets needed.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (reproducible, lockfile only)
        run: npm ci

      - name: Build + test
        run: npm test
