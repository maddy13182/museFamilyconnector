# Release: on merge to main, cut a signed CLI release when the CLI version
# in agent-skill/pyproject.toml is NEWER than the latest `cli-v*` GitHub
# Release tag.
#
# Steps: build the `hub` artifact (single script; deps install from the
# lockfile at install time, not bundled) → sha256 → sign with sigstore
# keyless OIDC → write the release manifest in TWO phases (phase 1 without
# skill fields; build the `skill.tar.gz` bundle embedding the phase-1
# manifest; phase 2 rewrites the manifest adding `skill_sha256` +
# `skill_version`) → create GitHub Release `cli-v<x.y.z>` with assets
# `hub`, `hub.sigstore`, `manifest.json`, `skill.tar.gz` → open a PR
# updating server/client-manifest.json (branch `release/manifest-cli-v<x.y.z>`).
#
# The manifest update goes through a PR (not a direct push to main):
# branch protection rejects direct pushes (GH006), and the version-newer-
# than-tag guard below means merging the manifest PR triggers one no-op
# release run — no loop. The owner merges the PR, then deploys the server
# (the build bundles the newly pinned CLI artifacts).
#
# Honest limit (docs/CLIENT_HARDENING_SPEC.md §2): this hardens the
# *supply chain*. Nothing here stops a root-level adversary on the
# installer's machine; it stops tampered / stale / corrupt artifacts.
#
# This workflow cannot be fully tested without cutting a real release;
# validate changes by dry-running the decision/build/sign steps on a
# scratch branch before merging.
name: Release CLI and skill

on:
  push:
    branches: [main]

# Minimal permissions: create releases and open the manifest-update PR, and
# mint the OIDC token that sigstore-python uses for keyless signing.
permissions:
  contents: write
  id-token: write
  pull-requests: write

# Two merges racing must not cut two releases for the same version.
concurrency:
  group: family-hub-release
  cancel-in-progress: false

jobs:
  release:
    name: sign + publish CLI release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The manifest-commit step pushes back to main.
          fetch-depth: 0

      - name: Read CLI version (single source of truth)
        id: cli
        run: |
          ver=$(python3 - <<'EOF'
          import re, sys
          text = open("agent-skill/pyproject.toml", encoding="utf-8").read()
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          if not m:
              sys.exit("agent-skill/pyproject.toml has no version line")
          print(m.group(1))
          EOF
          )
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Decoupled releases: the skill ships on its own cadence. The SKILL
      # VERSION header is the single source of truth for the skill version;
      # a header bump (with no CLI bump) cuts a skill-v* release below.
      - name: Read skill version (SKILL.md header)
        id: skillver
        run: |
          ver=$(python3 - <<'EOF'
          import re, sys
          text = open("agent-skill/SKILL.md", encoding="utf-8").read(4096)
          m = re.search(r"<!--\s*SKILL VERSION:\s*([0-9A-Za-z.\-+]+)\s*-->", text)
          if not m:
              sys.exit("agent-skill/SKILL.md has no SKILL VERSION header")
          print(m.group(1))
          EOF
          )
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Latest cli-v* release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName \
            --jq '[.[] | .tagName | select(startswith("cli-v"))][0] // empty')
          echo "tag=${tag:-none}" >> "$GITHUB_OUTPUT"

      - name: Latest skill-v* release tag
        id: latest_skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName \
            --jq '[.[] | .tagName | select(startswith("skill-v"))][0] // empty')
          echo "tag=${tag:-none}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          NEW_VERSION: ${{ steps.cli.outputs.version }}
          OLD_TAG: ${{ steps.latest.outputs.tag }}
          NEW_SKILL_VERSION: ${{ steps.skillver.outputs.version }}
          OLD_SKILL_TAG: ${{ steps.latest_skill.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import os, re
          def key(v, prefix):
              v = v.removeprefix(prefix)
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?", v)
              if not m:
                  raise SystemExit("refusing: existing tag %r is not semver" % v)
              nums = tuple(int(m.group(i)) for i in (1, 2, 3))
              pre = m.group(4) or ""
              # stable sorts above its own prerelease: (nums, is_stable, pre)
              return (nums, pre == "", pre)
          new = os.environ["NEW_VERSION"]
          old = os.environ["OLD_TAG"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", new):
              raise SystemExit("refusing: CLI version %r is not semver" % new)
          release = key(new, "cli-v") > key(old, "cli-v") if old != "none" else True
          # Decoupled releases: a skill-version bump with no CLI bump cuts a
          # skill-v* release. When a CLI release fires it covers the skill
          # (same tarball, tagged skill-v* too), so skill_release only drives
          # the standalone path.
          snew = os.environ["NEW_SKILL_VERSION"]
          sold = os.environ["OLD_SKILL_TAG"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", snew):
              raise SystemExit("refusing: skill version %r is not semver" % snew)
          skill_release = (
              key(snew, "skill-v") > key(sold, "skill-v") if sold != "none" else True
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("release=%s\n" % ("true" if release else "false"))
              fh.write("skill_release=%s\n" % ("true" if skill_release else "false"))
          print("cli=%s latest=%s -> release=%s" % (new, old, release))
          print("skill=%s latest=%s -> skill_release=%s" % (snew, sold, skill_release))
          EOF

      - name: Build the hub artifact
        if: steps.decide.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # The artifact is the single script; dependencies install from the
          # lockfile at install time and are NOT bundled.
          cp agent-skill/hub dist/hub
          # Stamp the release version: a single-file artifact has no adjacent
          # pyproject.toml and no pip metadata, so without this the artifact
          # would report 0.0.0-dev and `hub upgrade` self-test would fail.
          # pyproject.toml stays the single source of truth; the stamp is derived.
          python3 - "$NEW_VERSION" <<'EOF'
          import re, sys
          new = sys.argv[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", new):
              raise SystemExit("refusing to stamp non-semver %r" % new)
          p = "dist/hub"
          src = open(p, encoding="utf-8").read()
          src, n = re.subn(
              r'^_BUILD_VERSION = None$', '_BUILD_VERSION = "%s"' % new,
              src, count=1, flags=re.M,
          )
          if n != 1:
              raise SystemExit("expected exactly one _BUILD_VERSION anchor")
          open(p, "w", encoding="utf-8").write(src)
          EOF
          chmod +x dist/hub
          python3 dist/hub --version  # smoke: the artifact must run
          test "$(python3 dist/hub --version | grep -o '[0-9][0-9a-zA-Z.+-]*' | head -1)" = "$NEW_VERSION"

      - name: Compute sha256
        if: steps.decide.outputs.release == 'true'
        id: sha
        run: |
          sum=$(sha256sum dist/hub | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - name: Sign with sigstore (keyless OIDC)
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          pip install --quiet "sigstore>=3.0,<4.0"
          python3 -m sigstore sign --bundle dist/hub.sigstore dist/hub

      # Phase 1 of 2. Writes the release manifest WITHOUT the skill-bundle
      # fields (skill_sha256 / skill_version): the skill tarball built in the
      # NEXT step embeds THIS manifest, so the tarball cannot hash itself.
      # Phase 2 (after the tarball exists) rewrites this file ADDING the
      # skill fields. The circularity is open and load-bearing:
      #   - the tarball embeds the phase-1 manifest (its hub sha256 is
      #     identical in both phases; only the skill_* fields differ);
      #   - the manifest.json uploaded to the GitHub Release is the phase-2
      #     one (it names the tarball's sha256).
      # bundle-client.mjs verifies sha256(tarball) against BOTH the pin's
      # skill_sha256 and this phase-2 release manifest's skill_sha256.
      - name: "Write release manifest.json (phase 1: no skill fields)"
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.cli.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          version = os.environ["VERSION"]
          sha = os.environ["SHA256"]
          manifest = {
              "version": version,
              "sha256": sha,
              "files": {"hub": sha},
              "signature": "hub.sigstore",
              # The exact Fulcio certificate identity the CLI pins when it
              # verifies `hub.sigstore` (see `hub upgrade` / INSTALL.md).
              "identity": {
                  "issuer": "https://token.actions.githubusercontent.com",
                  "identity": (
                      "https://github.com/maddy13182/museFamilyconnector"
                      "/.github/workflows/release.yml@refs/heads/main"
                  ),
              },
              "released_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("dist/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF

      # Build the skill bundle: the full agent-skill/ tree the installer
      # needs (SKILL.md, references/ recursively, INSTALL.md,
      # requirements.txt) PLUS the release artifacts (the stamped dist/hub,
      # dist/hub.sigstore, and the PHASE-1 dist/manifest.json written above —
      # no skill_* fields, see the circularity note on the phase-1 step).
      #
      # Inclusion is an explicit relative-path allowlist (references/ is
      # copied recursively, then __pycache__/ and *.pyc are pruned), so the
      # exclusions (tests/, __pycache__/, pyproject.toml, requirements.lock,
      # hub.prev*, *.pyc) hold BY CONSTRUCTION — nothing else can get in.
      # A single `tar -C <stage>` with relative member names means no
      # absolute path and no `..` can sneak into the archive; the python
      # assertion below fails the build if any member violates that.
      - name: Build skill bundle
        if: steps.decide.outputs.release == 'true'
        id: skill
        run: |
          set -euo pipefail
          rm -rf dist/skill-stage
          mkdir -p dist/skill-stage
          cp agent-skill/SKILL.md agent-skill/INSTALL.md agent-skill/requirements.txt dist/skill-stage/
          # references/ is packaged RECURSIVELY; prune the excluded junk
          # (__pycache__/, *.pyc) after the copy. The other exclusions
          # (tests/, pyproject.toml, requirements.lock, hub.prev*) live
          # outside references/ and never enter the stage dir at all.
          cp -r agent-skill/references dist/skill-stage/references
          find dist/skill-stage/references \( -name '__pycache__' -o -name '*.pyc' \) -exec rm -rf {} +
          cp dist/hub dist/hub.sigstore dist/skill-stage/
          cp dist/manifest.json dist/skill-stage/manifest.json  # phase-1
          # Ownership is normalized to root:root so a non-root invitee can
          # extract with plain `tar -xzf` (otherwise tar tries to chown to
          # the release runner's uid/gid and exits non-zero for them).
          tar --owner=0 --group=0 --numeric-owner -czf dist/skill.tar.gz -C dist/skill-stage \
            SKILL.md references INSTALL.md requirements.txt hub hub.sigstore manifest.json
          rm -rf dist/skill-stage
          # Structural assertion: every member is a relative path inside the
          # bundle (no leading `/`, no `..` segments), no symlinks/hardlinks
          # (a link member could redirect extraction outside the target dir
          # on install), no excluded junk (tests/, __pycache__/,
          # pyproject.toml, requirements.lock, hub.prev*, *.pyc), and the
          # top-level member set is exactly the allowlist — the installer
          # extracts with plain `tar -xzf`.
          python3 - <<'EOF'
          import sys, tarfile
          tf = tarfile.open("dist/skill.tar.gz")
          members = tf.getmembers()
          top = set()
          for m in members:
              n = m.name
              if n.startswith("/") or n.startswith("./") or ".." in n.split("/"):
                  sys.exit("refusing: bundle member has unsafe path %r" % n)
              if m.issym() or m.islnk():
                  sys.exit("refusing: bundle member is a link %r" % n)
              if m.uid != 0 or m.gid != 0:
                  sys.exit("refusing: bundle member %r has non-root ownership %d:%d "
                           "(tar must use --owner=0 --group=0 --numeric-owner so "
                           "non-root invitees can extract)" % (n, m.uid, m.gid))
              segs = n.split("/")
              if ("tests" in segs or "__pycache__" in segs
                      or n.endswith("pyproject.toml") or n.endswith("requirements.lock")
                      or n.endswith(".pyc") or "hub.prev" in segs[-1]):
                  sys.exit("refusing: bundle member violates the exclusion list: %r" % n)
              top.add(segs[0])
          want = {"SKILL.md", "references", "INSTALL.md", "requirements.txt",
                  "hub", "hub.sigstore", "manifest.json"}
          if top != want:
              sys.exit("refusing: bundle top-level members %r != allowlist %r" % (sorted(top), sorted(want)))
          print("skill bundle members OK:", len(members), "members")
          for n in sorted(m.name for m in members):
              print("  ", n)
          EOF
          sum=$(sha256sum dist/skill.tar.gz | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "skill.tar.gz sha256=$sum"

      # Phase 2 of 2. Rewrites dist/manifest.json ADDING the skill fields.
      # skill_version is read from the `<!-- SKILL VERSION: x.y.z -->`
      # header of agent-skill/SKILL.md (single source of truth for the
      # skill version. Decoupled releases: a skill-version bump with no
      # CLI bump cuts a skill-v* release via the skill-only path below;
      # the CLI path also tags skill-v* so the bundle URL stays uniform).
      # The tarball from the previous step embeds the PHASE-1 manifest, so
      # phase-1 and phase-2 differ ONLY by these two fields (hub sha256 is
      # identical); bundle-client.mjs machine-checks that invariant.
      - name: "Write release manifest.json (phase 2: add skill fields)"
        if: steps.decide.outputs.release == 'true'
        env:
          SKILL_SHA256: ${{ steps.skill.outputs.sha256 }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          skill_sha = os.environ["SKILL_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", skill_sha):
              raise SystemExit("refusing: skill sha256 %r is not 64-hex" % skill_sha)
          header = open("agent-skill/SKILL.md", encoding="utf-8").read()
          m = re.search(r"<!-- SKILL VERSION: (\d+\.\d+\.\d+) -->", header)
          if not m:
              raise SystemExit("refusing: agent-skill/SKILL.md has no SKILL VERSION header")
          skill_version = m.group(1)
          with open("dist/manifest.json", encoding="utf-8") as fh:
              manifest = json.load(fh)
          if "skill_sha256" in manifest or "skill_version" in manifest:
              raise SystemExit("refusing: phase-1 manifest already has skill fields")
          manifest["skill_sha256"] = skill_sha
          manifest["skill_version"] = skill_version
          with open("dist/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Create GitHub Release
        if: steps.decide.outputs.release == 'true'
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cli.outputs.version }}
        run: |
          set -euo pipefail
          tag="cli-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "release $tag already exists; not recreating"
            exit 0
          fi
          gh release create "$tag" dist/hub dist/hub.sigstore dist/manifest.json dist/skill.tar.gz \
            --title "Family Hub CLI v${VERSION}" \
            --notes "Signed CLI release. Before installing: download all four assets, verify the sigstore signature, verify the sha256 of hub AND of skill.tar.gz against manifest.json, then install — see agent-skill/INSTALL.md. skill.tar.gz is the full skill bundle (SKILL.md, references/, INSTALL.md, requirements.txt, plus the hub artifact, its sigstore bundle, and this manifest); the server hosts it at /v1/client/download/skill.tar.gz."
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Decoupled releases: the skill bundle also ships under its own tag
      # (skill-v{skill_version}) so bundle-client.mjs can always fetch it
      # from skill-v{pin.skillVersion} — whether it was cut standalone or
      # as part of a CLI release.
      - name: Create skill-v release (CLI path)
        if: steps.decide.outputs.release == 'true' && steps.create.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cli.outputs.version }}
          SKILL_SHA256: ${{ steps.skill.outputs.sha256 }}
        run: |
          set -euo pipefail
          skill_ver=$(python3 - <<'EOF'
          import re
          text = open("agent-skill/SKILL.md", encoding="utf-8").read(4096)
          m = re.search(r"<!--\s*SKILL VERSION:\s*([0-9A-Za-z.\-+]+)\s*-->", text)
          print(m.group(1))
          EOF
          )
          python3 - "$skill_ver" "$SKILL_SHA256" "${VERSION}" <<'EOF'
          import datetime, hashlib, json, sys
          skill_ver, skill_sha, cli_ver = sys.argv[1], sys.argv[2], sys.argv[3]
          hub_sha = hashlib.sha256(open("dist/hub", "rb").read()).hexdigest()
          manifest = {
              "type": "skill",
              "skill_version": skill_ver,
              "skill_sha256": skill_sha,
              "cli_version": cli_ver,
              "hub_sha256": hub_sha,
              "released_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("dist/skill-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF
          tag="skill-v${skill_ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; not recreating"
            exit 0
          fi
          gh release create "$tag" dist/skill.tar.gz dist/skill-manifest.json \
            --title "Family Hub skill v${skill_ver}" \
            --notes "Skill bundle shipped with CLI v${VERSION}. Agents learn of it via the versions stanza on GET /v1/sync/topics — run \`hub upgrade\` to refresh."

      # --- Open the manifest-update PR -----------------------------------

      - name: Open the manifest-update PR
        if: steps.decide.outputs.release == 'true' && steps.create.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cli.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          SKILL_SHA256: ${{ steps.skill.outputs.sha256 }}
        run: |
          set -euo pipefail
          # Direct pushes to main are rejected by branch protection (GH006),
          # so the manifest update goes out as a PR. No loop risk: this
          # workflow only acts when pyproject.toml is newer than the latest
          # cli-v* tag, so merging the manifest PR triggers one no-op run.
          branch="release/manifest-cli-v${VERSION}"
          if git ls-remote --heads origin "$branch" | grep -q "$branch"; then
            echo "branch $branch already exists; not recreating"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          python3 - <<'EOF'
          import datetime, json, os, re
          path = "server/client-manifest.json"
          prev = {}
          if os.path.exists(path):
              with open(path, encoding="utf-8") as fh:
                  prev = json.load(fh)
          version = os.environ["VERSION"]
          skill_sha = os.environ["SKILL_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", skill_sha):
              raise SystemExit("refusing: skill sha256 %r is not 64-hex" % skill_sha)
          # skill_version is the SKILL VERSION header, not the CLI version:
          # the two version independently (docs/VERSIONING.md).
          header = open("agent-skill/SKILL.md", encoding="utf-8").read()
          m = re.search(r"<!-- SKILL VERSION: (\d+\.\d+\.\d+) -->", header)
          if not m:
              raise SystemExit("refusing: agent-skill/SKILL.md has no SKILL VERSION header")
          manifest = {
              "version": version,
              # Never raise the floor automatically: the deploy runbook raises
              # min_cli_version deliberately, after the fleet has upgraded
              # (see docs/CLIENT_HARDENING_SPEC.md §7).
              "min_cli_version": prev.get("min_cli_version", "0.0.0"),
              "download_url": (
                  "https://github.com/maddy13182/museFamilyconnector"
                  "/releases/download/cli-v%s/hub" % version
              ),
              "sha256": os.environ["SHA256"],
              "skill_sha256": skill_sha,
              "skill_version": m.group(1),
              "released_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF
          git add server/client-manifest.json
          if git diff --cached --quiet; then
            echo "no manifest change to commit"
            exit 0
          fi
          git commit -m "chore: pin client manifest to CLI v${VERSION}"
          git push -u origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already exists; not recreating"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: pin client manifest to CLI v${VERSION}" \
              --body "Automated by the Release CLI workflow after cutting \`cli-v${VERSION}\`. Updates \`server/client-manifest.json\` (version, download_url provenance, sha256, skill_sha256, skill_version, released_at); \`min_cli_version\` is intentionally untouched — the deploy runbook raises it deliberately. Merge, then deploy the server so the build bundles the newly pinned artifacts (including skill.tar.gz)."
          fi

      # --- Decoupled skill releases -------------------------------------
      # When the SKILL VERSION header moves without a CLI bump, the skill
      # ships on its own: skill-v* tag, skill.tar.gz built from the current
      # docs + the latest CLI release's hub artifacts (verified), and a
      # manifest PR that re-pins only the skill fields. The CLI path above
      # covers the skill when it fires (same tarball, tagged skill-v* too),
      # so these steps run only when the CLI release does NOT.

      - name: Fetch CLI artifacts for skill-only build
        if: steps.decide.outputs.release != 'true' && steps.decide.outputs.skill_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$CLI_TAG" = "none" ]; then
            echo "refusing: skill-only release needs a CLI release to bundle its hub from" >&2
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          base="https://github.com/maddy13182/museFamilyconnector/releases/download/${CLI_TAG}"
          curl -sSL --fail -o dist/hub "$base/hub"
          curl -sSL --fail -o dist/hub.sigstore "$base/hub.sigstore"
          curl -sSL --fail -o dist/cli-manifest.json "$base/manifest.json"
          # Verify the hub against the release manifest before bundling it.
          python3 - <<'EOF'
          import hashlib, json, sys
          hub = open("dist/hub", "rb").read()
          man = json.load(open("dist/cli-manifest.json", encoding="utf-8"))
          want = man.get("sha256") or (man.get("files") or {}).get("hub")
          got = hashlib.sha256(hub).hexdigest()
          if not want or got != want.lower():
              sys.exit("refusing: downloaded hub sha256 %s != release manifest %s" % (got, want))
          print("hub verified against %s: %s" % (man.get("version"), got[:16]))
          EOF
          chmod +x dist/hub

      - name: Build skill bundle (skill-only)
        if: steps.decide.outputs.release != 'true' && steps.decide.outputs.skill_release == 'true'
        id: skillonly
        run: |
          set -euo pipefail
          # Reconstruct the phase-1 manifest (no skill_* fields): the cli-v
          # release publishes only the phase-2 manifest, and phase-2 was
          # built by ADDING the skill fields to phase-1, so stripping them
          # restores it byte-identically (bundle-client.mjs check 7 demands
          # phase-1 inside the tarball).
          python3 - <<'EOF'
          import json
          man = json.load(open("dist/cli-manifest.json", encoding="utf-8"))
          phase1 = {k: v for k, v in man.items() if k not in ("skill_sha256", "skill_version")}
          assert "skill_sha256" not in phase1 and "skill_version" not in phase1
          with open("dist/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(phase1, fh, indent=2)
              fh.write("\n")
          print("phase-1 manifest reconstructed for CLI", phase1["version"])
          EOF
          rm -rf dist/skill-stage
          mkdir -p dist/skill-stage
          cp agent-skill/SKILL.md agent-skill/INSTALL.md agent-skill/requirements.txt dist/skill-stage/
          cp -r agent-skill/references dist/skill-stage/references
          find dist/skill-stage/references \( -name '__pycache__' -o -name '*.pyc' \) -exec rm -rf {} +
          cp dist/hub dist/hub.sigstore dist/skill-stage/
          cp dist/manifest.json dist/skill-stage/manifest.json  # phase-1
          # Same contract as the CLI path's "Build skill bundle" step above:
          # explicit allowlist, root:root ownership, relative members only.
          # Keep the two in sync.
          tar --owner=0 --group=0 --numeric-owner -czf dist/skill.tar.gz -C dist/skill-stage \
            SKILL.md references INSTALL.md requirements.txt hub hub.sigstore manifest.json
          rm -rf dist/skill-stage
          python3 - <<'EOF'
          import sys, tarfile
          tf = tarfile.open("dist/skill.tar.gz")
          members = tf.getmembers()
          top = set()
          for m in members:
              n = m.name
              if n.startswith("/") or n.startswith("./") or ".." in n.split("/"):
                  sys.exit("refusing: bundle member has unsafe path %r" % n)
              if m.issym() or m.islnk():
                  sys.exit("refusing: bundle member is a link %r" % n)
              if m.uid != 0 or m.gid != 0:
                  sys.exit("refusing: bundle member %r has non-root ownership" % n)
              segs = n.split("/")
              if ("tests" in segs or "__pycache__" in segs
                      or n.endswith("pyproject.toml") or n.endswith("requirements.lock")
                      or n.endswith(".pyc") or "hub.prev" in segs[-1]):
                  sys.exit("refusing: bundle member violates the exclusion list: %r" % n)
              top.add(segs[0])
          want = {"SKILL.md", "references", "INSTALL.md", "requirements.txt",
                  "hub", "hub.sigstore", "manifest.json"}
          if top != want:
              sys.exit("refusing: bundle top-level members %r != allowlist %r" % (sorted(top), sorted(want)))
          print("skill bundle members OK:", len(members), "members")
          EOF
          sum=$(sha256sum dist/skill.tar.gz | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "skill.tar.gz sha256=$sum"

      - name: Write skill-release manifest.json
        if: steps.decide.outputs.release != 'true' && steps.decide.outputs.skill_release == 'true'
        env:
          SKILL_VERSION: ${{ steps.skillver.outputs.version }}
          SKILL_SHA256: ${{ steps.skillonly.outputs.sha256 }}
          CLI_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, re
          skill_sha = os.environ["SKILL_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", skill_sha):
              raise SystemExit("refusing: skill sha256 %r is not 64-hex" % skill_sha)
          cli_man = json.load(open("dist/cli-manifest.json", encoding="utf-8"))
          manifest = {
              "type": "skill",
              "skill_version": os.environ["SKILL_VERSION"],
              "skill_sha256": skill_sha,
              "cli_version": cli_man["version"],
              "hub_sha256": cli_man["sha256"],
              "released_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("dist/skill-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Create skill GitHub Release
        if: steps.decide.outputs.release != 'true' && steps.decide.outputs.skill_release == 'true'
        id: create_skill
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_VERSION: ${{ steps.skillver.outputs.version }}
        run: |
          set -euo pipefail
          tag="skill-v${SKILL_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "release $tag already exists; not recreating"
            exit 0
          fi
          gh release create "$tag" dist/skill.tar.gz dist/skill-manifest.json \
            --title "Family Hub skill v${SKILL_VERSION}" \
            --notes "Skill-only release (docs). skill.tar.gz bundles the current skill docs with the latest CLI release's hub artifact; the server hosts it at /v1/client/download/skill.tar.gz. Agents learn of it via the versions stanza on GET /v1/sync/topics — run \`hub upgrade\` to refresh."
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Open the skill manifest-update PR
        if: steps.decide.outputs.release != 'true' && steps.decide.outputs.skill_release == 'true' && steps.create_skill.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL_VERSION: ${{ steps.skillver.outputs.version }}
          SKILL_SHA256: ${{ steps.skillonly.outputs.sha256 }}
        run: |
          set -euo pipefail
          branch="release/manifest-skill-v${SKILL_VERSION}"
          if git ls-remote --heads origin "$branch" | grep -q "$branch"; then
            echo "branch $branch already exists; not recreating"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          python3 - <<'EOF'
          import datetime, json, os, re
          path = "server/client-manifest.json"
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          skill_sha = os.environ["SKILL_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", skill_sha):
              raise SystemExit("refusing: skill sha256 %r is not 64-hex" % skill_sha)
          # Skill-only release: re-pin ONLY the skill fields. CLI fields
          # (version, sha256, download_url, min_cli_version) are untouched.
          manifest["skill_version"] = os.environ["SKILL_VERSION"]
          manifest["skill_sha256"] = skill_sha
          manifest["released_at"] = datetime.datetime.now(
              datetime.timezone.utc
          ).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          EOF
          git add server/client-manifest.json
          if git diff --cached --quiet; then
            echo "no manifest change to commit"
            exit 0
          fi
          git commit -m "chore: pin client manifest to skill v${SKILL_VERSION}"
          git push -u origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already exists; not recreating"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: pin client manifest to skill v${SKILL_VERSION}" \
              --body "Automated by the release workflow after cutting \`skill-v${SKILL_VERSION}\` (skill-only release). Updates \`server/client-manifest.json\` skill fields (skill_version, skill_sha256, released_at); CLI fields untouched. Merge, then deploy the server so the build bundles the newly pinned skill.tar.gz from the skill-v tag."
          fi
