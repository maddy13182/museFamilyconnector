<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="#122E2C"/>
  <text x="600" y="44" font-size="18" font-weight="800" fill="#FAF6EF" text-anchor="middle" letter-spacing="1">END-TO-END ENCRYPTION — WHAT THE SERVER SEES</text>

  <!-- Step 1 -->
  <g filter="url(#soft2)">
    <rect x="40" y="80" width="230" height="150" rx="14" fill="#FAF6EF"/>
    <text x="155" y="112" font-size="14" font-weight="800" fill="#C2703D" text-anchor="middle">1 · SEAL</text>
    <text x="155" y="140" font-size="15" font-weight="700" fill="#2D2A26" text-anchor="middle">Mom's agent</text>
    <text x="155" y="164" font-size="13" fill="#5A554C" text-anchor="middle">locks the message with</text>
    <text x="155" y="184" font-size="13" fill="#5A554C" text-anchor="middle">the topic's sealed key</text>
    <text x="155" y="210" font-size="12" fill="#8A8478" text-anchor="middle">on her own device</text>
  </g>

  <!-- Step 2 -->
  <line x1="270" y1="155" x2="330" y2="155" stroke="#8A8478" stroke-width="2" marker-end="url(#arrow2)"/>
  <g filter="url(#soft2)">
    <rect x="340" y="80" width="230" height="150" rx="14" fill="#1E4A46" stroke="#3A6B66" stroke-width="1.5"/>
    <text x="455" y="112" font-size="14" font-weight="800" fill="#E8B96A" text-anchor="middle">2 · STORE</text>
    <text x="455" y="140" font-size="15" font-weight="700" fill="#FAF6EF" text-anchor="middle">Family Hub</text>
    <text x="455" y="164" font-size="13" fill="#C9D8D4" text-anchor="middle">stores only ciphertext</text>
    <text x="455" y="184" font-size="13" fill="#C9D8D4" text-anchor="middle">— a sealed envelope</text>
    <text x="455" y="210" font-size="12" fill="#E8B96A" text-anchor="middle">it cannot open it</text>
  </g>

  <!-- Step 3 -->
  <line x1="570" y1="155" x2="630" y2="155" stroke="#8A8478" stroke-width="2" marker-end="url(#arrow2)"/>
  <g filter="url(#soft2)">
    <rect x="640" y="80" width="230" height="150" rx="14" fill="#1E4A46" stroke="#3A6B66" stroke-width="1.5"/>
    <text x="755" y="112" font-size="14" font-weight="800" fill="#E8B96A" text-anchor="middle">3 · DELIVER</text>
    <text x="755" y="140" font-size="15" font-weight="700" fill="#FAF6EF" text-anchor="middle">Dad's agent</text>
    <text x="755" y="164" font-size="13" fill="#C9D8D4" text-anchor="middle">fetches the envelope</text>
    <text x="755" y="184" font-size="13" fill="#C9D8D4" text-anchor="middle">on his next sync</text>
    <text x="755" y="210" font-size="12" fill="#E8B96A" text-anchor="middle">still sealed in transit</text>
  </g>

  <!-- Step 4 -->
  <line x1="870" y1="155" x2="930" y2="155" stroke="#8A8478" stroke-width="2" marker-end="url(#arrow2)"/>
  <g filter="url(#soft2)">
    <rect x="940" y="80" width="230" height="150" rx="14" fill="#FAF6EF"/>
    <text x="1055" y="112" font-size="14" font-weight="800" fill="#2F6F6A" text-anchor="middle">4 · OPEN</text>
    <text x="1055" y="140" font-size="15" font-weight="700" fill="#2D2A26" text-anchor="middle">Dad's agent</text>
    <text x="1055" y="164" font-size="13" fill="#5A554C" text-anchor="middle">unseals it with</text>
    <text x="1055" y="184" font-size="13" fill="#5A554C" text-anchor="middle">his own sealed key</text>
    <text x="1055" y="210" font-size="12" fill="#8A8478" text-anchor="middle">on his own device</text>
  </g>

  <text x="600" y="276" font-size="14" fill="#C9D8D4" text-anchor="middle">Keys never leave devices · removing a member re-keys the topic · 24-word recovery phrase</text>
</svg>
