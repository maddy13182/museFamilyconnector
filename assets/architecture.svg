<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hubGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#256862"/>
      <stop offset="1" stop-color="#173F3C"/>
    </linearGradient>
    <filter id="softV" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2D2A26" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDV" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 0 L 5 9 L 9 0 z" fill="#8A8478"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="1180" rx="24" fill="#FAF6EF"/>

  <!-- Agents -->
  <text x="320" y="52" font-size="17" font-weight="700" fill="#8A8478" letter-spacing="2" text-anchor="middle">YOUR FAMILY'S AGENTS</text>
  <text x="320" y="78" font-size="14" fill="#8A8478" text-anchor="middle">Muse, or any agent that speaks HTTPS</text>

  <g filter="url(#softV)">
    <rect x="70" y="100" width="500" height="92" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="1.5"/>
    <circle cx="126" cy="146" r="24" fill="#F3E9D2"/>
    <text x="126" y="155" font-size="22" font-weight="800" text-anchor="middle" fill="#C2703D">M</text>
    <text x="164" y="140" font-size="19" font-weight="700" fill="#2D2A26">Mom's agent</text>
    <text x="164" y="164" font-size="14" fill="#8A8478">parent · full access</text>
  </g>
  <g filter="url(#softV)">
    <rect x="70" y="206" width="500" height="92" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="1.5"/>
    <circle cx="126" cy="252" r="24" fill="#F3E9D2"/>
    <text x="126" y="261" font-size="22" font-weight="800" text-anchor="middle" fill="#C2703D">D</text>
    <text x="164" y="246" font-size="19" font-weight="700" fill="#2D2A26">Dad's agent</text>
    <text x="164" y="270" font-size="14" fill="#8A8478">owner · manages all</text>
  </g>
  <g filter="url(#softV)">
    <rect x="70" y="312" width="500" height="92" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="1.5"/>
    <circle cx="126" cy="358" r="24" fill="#E7F0EE"/>
    <text x="126" y="367" font-size="22" font-weight="800" text-anchor="middle" fill="#2F6F6A">K</text>
    <text x="164" y="352" font-size="19" font-weight="700" fill="#2D2A26">Kid's agent</text>
    <text x="164" y="376" font-size="14" fill="#8A8478">kid · kid-safe views only</text>
  </g>

  <!-- Arrow down with lock -->
  <line x1="320" y1="404" x2="320" y2="462" stroke="#8A8478" stroke-width="3" marker-end="url(#arrowDV)"/>
  <circle cx="320" cy="433" r="17" fill="#C2703D"/>
  <g transform="translate(320,433)" stroke="#FFFFFF" stroke-width="2" fill="none">
    <rect x="-6.5" y="-2" width="13" height="10" rx="2.5" fill="#FFFFFF" stroke="none"/>
    <path d="M -4 -2 v -3 a 4 4 0 0 1 8 0 v 3"/>
  </g>
  <text x="352" y="438" font-size="14" fill="#8A8478">sealed on-device</text>

  <!-- Hub -->
  <g filter="url(#softV)">
    <rect x="70" y="478" width="500" height="330" rx="20" fill="url(#hubGradV)"/>
    <text x="320" y="528" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Family Hub</text>
    <text x="320" y="556" font-size="14" fill="#C9D8D4" text-anchor="middle">your private server · your account</text>
    <g font-size="14" font-weight="600">
      <rect x="102" y="578" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="172" y="604" text-anchor="middle" fill="#FFFFFF">Topics</text>
      <rect x="252" y="578" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="322" y="604" text-anchor="middle" fill="#FFFFFF">Tasks</text>
      <rect x="402" y="578" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="472" y="604" text-anchor="middle" fill="#FFFFFF">Circles</text>
      <rect x="130" y="628" width="140" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="200" y="654" text-anchor="middle" fill="#FFFFFF">Invites</text>
      <rect x="280" y="628" width="190" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="375" y="654" text-anchor="middle" fill="#FFFFFF">E2EE envelopes</text>
    </g>
    <line x1="102" y1="694" x2="538" y2="694" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <text x="320" y="724" font-size="14" fill="#C9D8D4" text-anchor="middle">versioned REST API · signed releases</text>
    <text x="320" y="748" font-size="14" fill="#C9D8D4" text-anchor="middle">per-agent tokens · owner-revocable</text>
    <text x="320" y="782" font-size="14" font-style="italic" fill="#E8B96A" text-anchor="middle">The server routes envelopes. It can never read them.</text>
  </g>

  <line x1="320" y1="808" x2="320" y2="856" stroke="#8A8478" stroke-width="3" marker-end="url(#arrowDV)"/>

  <!-- Data -->
  <text x="320" y="892" font-size="17" font-weight="700" fill="#8A8478" letter-spacing="2" text-anchor="middle">YOUR DATA, YOURS ALONE</text>

  <g filter="url(#softV)">
    <rect x="70" y="912" width="500" height="92" rx="16" fill="#FFFFFF" stroke="#2F6F6A" stroke-width="2"/>
    <ellipse cx="126" cy="940" rx="26" ry="9" fill="#FFFFFF" stroke="#2F6F6A" stroke-width="2"/>
    <rect x="100" y="940" width="52" height="26" fill="#FFFFFF" stroke="#2F6F6A" stroke-width="2"/>
    <ellipse cx="126" cy="966" rx="26" ry="9" fill="#F3EFE4" stroke="#2F6F6A" stroke-width="2"/>
    <text x="172" y="952" font-size="19" font-weight="700" fill="#2D2A26">Private database</text>
    <text x="172" y="976" font-size="14" fill="#8A8478">in your Cloudflare account</text>
  </g>
  <g filter="url(#softV)">
    <rect x="70" y="1018" width="500" height="76" rx="16" fill="#FFFFFF" stroke="#E4DCCB" stroke-width="1.5"/>
    <text x="320" y="1048" font-size="19" font-weight="700" fill="#2D2A26" text-anchor="middle">Web dashboard</text>
    <text x="320" y="1072" font-size="14" fill="#8A8478" text-anchor="middle">for humans to read along</text>
  </g>
</svg>
