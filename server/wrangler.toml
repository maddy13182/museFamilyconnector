# Family Hub — Cloudflare Worker config.
# Account bindings and private secrets are generated by scripts/deploy_hub.py.
# Use npm run deploy:hub; never deploy this template directly.

name = "family-hub"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Portable template. Do not put account IDs or database IDs here.
# Run npm run deploy:hub -- --name YOUR-HUB; generated settings are ignored by Git.

[[d1_databases]]
binding = "DB"
database_name = "family-hub"
# database_id and account_id are injected into the generated local config.

# Workers Logs: structured request/error logs (with the server version on
# every line) are delivered to Cloudflare. View with `wrangler tail` or the
# dashboard's Logs tab.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# "0" during first bootstrap, then set to "1" and redeploy. Unauthenticated
# POST /v2/families is then rejected; owners can still create more circles.
SETUP_LOCKED = "1"
# Client version gate (B1): minimum CLI version allowed to call the API.
# "0.0.0" = gate off. Raise deliberately per the deploy runbook only AFTER
# the installed fleet reports >= the new version — never ship a deploy that
# bricks the currently-installed fleet.
MIN_CLI_VERSION = "2.0.0"
