# Single source of truth for the Family Hub CLI version (contract C6,
# docs/VERSIONING.md). `agent-skill/hub` reads its version from this file
# (or from installed package metadata) — never hardcode it elsewhere.
#
# The release artifact is the single `hub` file, cut as a `cli-v*` tag by
# the release workflow and served by the hub server itself (this file is
# the version registry + dependency declaration, not the channel).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "family-hub-cli"
version = "2.2.0"
description = "Family Hub agent CLI (the `hub` single-file script)"
requires-python = ">=3.9"
dependencies = [
    "PyNaCl==1.6.2",
    "mnemonic==0.21",
]

[project.urls]
Repository = "https://github.com/maddy13182/museFamilyconnector"
